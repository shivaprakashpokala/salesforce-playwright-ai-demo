name: Salesforce Playwright tests

# Runs on demand from the Actions tab (Run workflow).
# Signs in with the JWT bearer flow, so no password and no verification code.
# Needs four repository secrets:
#   SF_LOGIN_URL    the org's My Domain login URL
#   SF_USERNAME     the user the tests run as
#   SF_CLIENT_ID    consumer key of the External Client App
#   SF_PRIVATE_KEY  the private key (paste the whole PEM file)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check team conventions
        run: npm run check

      - name: Run Playwright tests
        env:
          SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
        run: npx playwright test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
