name: Salesforce Playwright tests

# Runs on demand from the Actions tab (Run workflow).
# Needs three repository secrets: SF_LOGIN_URL, SF_USERNAME, SF_PASSWORD.
# Optional: SF_STORAGE_STATE, the base64 of a saved .auth/state.json, so Salesforce
# recognises the browser and does not ask for an emailed verification code.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check team conventions
        run: npm run check

      - name: Restore saved Salesforce session (optional)
        env:
          SF_STORAGE_STATE: ${{ secrets.SF_STORAGE_STATE }}
        run: |
          if [ -n "$SF_STORAGE_STATE" ]; then
            mkdir -p .auth
            echo "$SF_STORAGE_STATE" | base64 -d > .auth/state.json
          fi

      - name: Run Playwright tests
        env:
          SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        run: npx playwright test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
